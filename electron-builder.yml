appId: com.bianhe.app
productName: 辩盒
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json,yarn.lock}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - '**/node_modules/better-sqlite3/**'
  - '**/*.node'
extraResources:
  - from: data
    to: data
    filter:
      - '**/*.json'
win:
  executableName: bianhe
  icon: build/icon.png
  signAndEditExecutable: false
  target:
    - nsis
  compression: maximum
nsis:
  artifactName: bianhe-${version}-windows-setup.${ext}
  shortcutName: 辩盒
  uninstallDisplayName: 辩盒
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  icon: build/icon.png
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - documentsPersistOnQuit: true
    - LSEnvironment:
        - GIT_CRON_TASK_DISABLED: 1
  target:
    - dmg
  notarize: false
dmg:
  artifactName: bianhe-${version}-macos.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  maintainer: bianhe.app
  category: Utility
deb:
  artifactName: bianhe-${version}-linux.${ext}
appImage:
  artifactName: bianhe-${version}-linux.${ext}
npmRebuild: true
publish:
  provider: github
  owner: tianhaoqi648-ops
  repo: bianhe
  releaseType: release
