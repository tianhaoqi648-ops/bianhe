name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (bianhe)
        uses: actions/checkout@v4
        with:
          # 不持久化 GITHUB_TOKEN 到仓库本地 git 配置：persist-credentials 默认
          # 会写入 http.https://github.com/.extraheader，导致同 job 内后续对
          # github.com 的匿名 clone（Mini 仓）也带上无权限凭据而失败。
          persist-credentials: false
      - name: Checkout Mini (bianhe-miniprogram) for core sync check
        # 默认 GITHUB_TOKEN 是 bianhe 的仓库级 installation token，无法跨仓 checkout
        #（即使 Mini 仓公开，actions/checkout 也不会回退匿名；CI 首跑已实测失败）。
        # Mini 仓为公开仓，改用匿名浅 clone（本地已实测匿名 ls-remote/clone 可行）。
        run: git clone --depth 1 https://github.com/tianhaoqi648-ops/bianhe-miniprogram.git ../bianhe-miniprogram
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Core sync check (hard gate, no auto-sync)
        run: npm run core:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Golden test
        run: npm run test:golden