name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (bianhe)
        uses: actions/checkout@v4
        with:
          # 不持久化 GITHUB_TOKEN 到仓库本地 git 配置：persist-credentials 默认
          # 会写入 http.https://github.com/.extraheader，导致同 job 内后续对
          # github.com 的匿名 clone（Mini 仓）也带上无权限凭据而失败。
          persist-credentials: false
      - name: Checkout Mini (bianhe-miniprogram) for core sync check
        uses: actions/checkout@v4
        with:
          repository: tianhaoqi648-ops/bianhe-miniprogram
          path: ../bianhe-miniprogram
          # 默认 GITHUB_TOKEN 是 bianhe 的仓库级 installation token，无法跨仓
          # checkout（CI 首跑 run 34258890045 已实测），必须使用只读 PAT。
          # persist-credentials: false 使 PAT 仅用于本次 clone，不写入磁盘。
          token: ${{ secrets.MINI_REPO_TOKEN }}
          persist-credentials: false
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Core sync check (hard gate, no auto-sync)
        run: npm run core:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Golden test
        run: npm run test:golden