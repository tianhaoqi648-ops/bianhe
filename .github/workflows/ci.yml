name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (bianhe)
        uses: actions/checkout@v4
      - name: Checkout Mini (bianhe-miniprogram) for core sync check
        uses: actions/checkout@v4
        with:
          repository: tianhaoqi648-ops/bianhe-miniprogram
          path: ../bianhe-miniprogram
          # 私有仓需配置可读 PAT；公开仓可用默认 token（删除此行为空/公开时）
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Core sync check (hard gate, no auto-sync)
        run: npm run core:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Golden test
        run: npm run test:golden