name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact-name: bianhe-windows
            artifact-path: |
              dist/*.exe
          - os: macos-latest
            platform: mac
            artifact-name: bianhe-macos
            artifact-path: |
              dist/*.dmg
          - os: ubuntu-latest
            platform: linux
            artifact-name: bianhe-linux
            artifact-path: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 不持久化 GITHUB_TOKEN（理由同 ci.yml）：发布用 electron-builder 的
          # GH_TOKEN 环境变量，不依赖 git 持久凭据；避免污染后续匿名 clone。
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Checkout Mini (core sync check)
        uses: actions/checkout@v4
        with:
          repository: tianhaoqi648-ops/bianhe-miniprogram
          # path 必须在 GITHUB_WORKSPACE 内（同 ci.yml），由 --target 指向它。
          path: mini-repo
          # 默认 GITHUB_TOKEN 是 bianhe 的仓库级 installation token，无法跨仓
          # checkout，必须使用只读 PAT（与 ci.yml 保持同一认证策略）。
          # persist-credentials: false 使 PAT 仅用于本次 clone，不写入磁盘。
          token: ${{ secrets.MINI_REPO_TOKEN }}
          persist-credentials: false
      - name: Core sync check (hard gate)
        run: npm run core:check -- --target mini-repo

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Typecheck (node + web)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

      - name: Package and publish to GitHub Release
        run: npx electron-builder --${{ matrix.platform }} --publish onTag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release notes (current version only)
        if: startsWith(github.ref, 'refs/tags/v')
        # shell: bash 显式指定：Windows runner 默认 pwsh 无 awk，git bash 自带
        shell: bash
        # 只把「当前 tag 对应的版本章节」写入 Release 描述，避免混入其他版本内容
        # （RELEASE_NOTES.md 仓库内保留全部历史章节，此处按 '# 辩盒 vX.Y.Z' 标题切分）
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^# 辩盒 v[0-9]+\.[0-9]+\.[0-9]+/ {
              if (match($0, /v[0-9]+\.[0-9]+\.[0-9]+/)) cur = substr($0, RSTART+1, RLENGTH-1)
              if (cur == ver) { print; sec=1; next }
              if (sec) exit
              next
            }
            sec { print }
          ' RELEASE_NOTES.md > release-notes-current.md
          [ -s release-notes-current.md ] || { echo "::error::notes extraction failed for v${VERSION}"; exit 1; }
          gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes-current.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: warn
          retention-days: 30
